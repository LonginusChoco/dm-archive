<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DM Archive — 非公式カード検索データベース</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14161c;
    --panel: #1b1e26;
    --panel-2: #20232d;
    --line: #2b2f3a;
    --text: #e7e6e1;
    --text-dim: #9297a3;
    --text-faint: #5c6270;
    --civ-hikari: #d9b64a;
    --civ-mizu: #3a8fd9;
    --civ-yami: #8c5fc9;
    --civ-hi: #e0553f;
    --civ-shizen: #4fa34a;
    --civ-zero: #838a97;
    --accent: #e0553f;
    --danger: #d9534f;
    --radius: 3px;
    --tile-min: 140px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
    line-height:1.6; min-height:100vh;
  }
  code, .mono{font-family:"JetBrains Mono", monospace;}
  button{font-family:inherit;}

  header.site{
    padding:28px 20px 22px; border-bottom:1px solid var(--line);
    background:
      linear-gradient(90deg, var(--civ-hikari) 0 16.6%, var(--civ-mizu) 16.6% 33.2%, var(--civ-yami) 33.2% 49.8%, var(--civ-hi) 49.8% 66.4%, var(--civ-shizen) 66.4% 83%, var(--civ-zero) 83% 100%) top/100% 3px no-repeat,
      var(--bg);
  }
  header.site .title-row{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; max-width:1400px; margin:0 auto;}
  header.site h1{font-size:22px; font-weight:900; letter-spacing:.02em; margin:0;}
  header.site .subtitle{color:var(--text-dim); font-size:13px;}
  header.site .stat-line{max-width:1400px; margin:10px auto 0; color:var(--text-faint); font-size:12.5px; font-family:"JetBrains Mono", monospace;}

  .layout{max-width:1400px; margin:0 auto; padding:18px 20px 80px; display:grid; grid-template-columns:300px 1fr; gap:22px;}
  @media (max-width: 880px){ .layout{grid-template-columns:1fr; padding:14px 12px 40px;} }

  #filterToggleBtn{display:none;}
  @media (max-width: 880px){
    #filterToggleBtn{
      display:block; position:sticky; top:8px; z-index:40; margin-bottom:10px;
      background:rgba(224,85,63,.16); color:var(--text); border:1px solid rgba(224,85,63,.5);
      padding:10px; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer;
      backdrop-filter:blur(4px);
    }
    #filterPanel{display:none;}
    #filterPanel.open{display:block; position:fixed; inset:0; z-index:39; overflow-y:auto; padding:64px 14px 40px; background:var(--bg);}
  }

  #filterPanel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px; align-self:start; position:sticky; top:14px; max-height:calc(100vh - 28px); overflow-y:auto;}
  .facet{border-bottom:1px solid var(--line); padding:10px 0;}
  .facet:last-child{border-bottom:none;}
  .facet-head{display:flex; align-items:center; justify-content:space-between; cursor:pointer; user-select:none; gap:6px;}
  .facet-head h3{font-size:13px; margin:0; font-weight:700; letter-spacing:.02em; flex:1;}
  .facet-head .caret{color:var(--text-faint); font-size:11px; transition:transform .15s; flex-shrink:0;}
  .facet.expanded .facet-head .caret{transform:rotate(90deg);}
  .facet-body{margin-top:8px; display:none;}
  .facet.expanded .facet-body{display:block;}

  .input-wrap{position:relative;}
  .input-wrap input[type=text]{
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:6px 26px 6px 8px; font-size:12.5px; border-radius:var(--radius);
  }
  .input-wrap .clear-x{
    position:absolute; right:5px; top:50%; transform:translateY(-50%);
    background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:14px; padding:2px 4px; line-height:1;
  }
  .input-wrap .clear-x:hover{color:var(--danger);}

  .facet-search{margin-bottom:6px;}

  .toggle-switch{
    display:inline-flex; align-items:center; gap:0; border:1px solid var(--line); border-radius:14px;
    background:var(--panel-2); cursor:pointer; font-size:11px; overflow:hidden; user-select:none;
  }
  .toggle-switch span{padding:4px 10px; color:var(--text-faint);}
  .toggle-switch span.on{background:var(--accent); color:#fff; font-weight:700;}
  .mode-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .mode-row .mode-label{font-size:11px; color:var(--text-faint);}

  .select-all-row{display:flex; gap:10px; margin-bottom:5px;}
  .select-all-row button{
    background:none; border:none; color:var(--text-faint); font-size:11px; cursor:pointer; padding:0; text-decoration:underline;
  }
  .select-all-row button:hover{color:var(--accent);}

  .facet-options{max-height:190px; overflow-y:auto;}
  .facet-option{display:flex; align-items:center; gap:6px; font-size:12.5px; padding:2px 0; color:var(--text-dim);}
  .facet-option input{accent-color:var(--accent); flex-shrink:0;}
  .facet-option label{cursor:pointer; flex:1;}
  .facet-option .n{color:var(--text-faint); font-size:10.5px; font-family:"JetBrains Mono", monospace;}

  /* civilization: 3-state chips */
  .civ-row{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;}
  .civ-chip{
    padding:6px 10px; border-radius:14px; font-size:12px; cursor:pointer; user-select:none;
    border:1.5px solid var(--line); color:var(--text-dim); background:var(--panel-2);
  }
  .civ-chip[data-state="include"]{color:#14161c; border-color:transparent; background:var(--chip-color); font-weight:700; box-shadow:0 0 0 2px var(--chip-color), 0 0 8px var(--chip-color);}
  .civ-chip[data-state="exclude"]{color:var(--danger); border-color:var(--danger); background:transparent; text-decoration:line-through;}
  .colorcount-row{display:flex; gap:6px; margin-bottom:8px;}
  .colorcount-row button{
    flex:1; background:var(--panel-2); border:1px solid var(--line); color:var(--text-dim);
    font-size:11px; padding:5px 0; cursor:pointer; border-radius:var(--radius);
  }
  .colorcount-row button.active{background:var(--accent); color:#fff; border-color:var(--accent);}

  .range-row{display:flex; align-items:center; gap:6px;}
  .range-row input[type=number]{width:64px; background:var(--panel-2); border:1px solid var(--line); color:var(--text); padding:5px 6px; font-size:12.5px; border-radius:var(--radius);}
  .range-row span{color:var(--text-faint); font-size:12px;}
  .range-reset{background:none; border:none; color:var(--text-faint); font-size:11px; cursor:pointer; text-decoration:underline; margin-left:4px;}
  .range-reset:hover{color:var(--accent);}

  .toggle-row{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-dim); margin-top:4px;}
  .toggle-row input{accent-color:var(--accent);}

  .fw-target-row{display:flex; gap:10px; margin:6px 0; flex-wrap:wrap;}
  .fw-target-row label{display:flex; align-items:center; gap:4px; font-size:11.5px; color:var(--text-dim);}
  .fw-target-row input{accent-color:var(--accent);}

  #resetBtn{width:100%; margin-top:12px; background:transparent; border:1px solid var(--line); color:var(--text-dim); padding:8px; border-radius:var(--radius); font-size:12.5px; cursor:pointer;}
  #resetBtn:hover{border-color:var(--accent); color:var(--text);}

  .result-head{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:14px; color:var(--text-dim); font-size:13px;}
  #resultCount b{color:var(--text); font-family:"JetBrains Mono", monospace;}
  .display-controls{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .display-controls select{background:var(--panel-2); border:1px solid var(--line); color:var(--text); padding:5px 8px; border-radius:var(--radius); font-size:12px;}
  .display-controls button.dir-btn{background:var(--panel-2); border:1px solid var(--line); color:var(--text); padding:5px 9px; border-radius:var(--radius); font-size:12px; cursor:pointer;}
  .size-row{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-faint);}
  .size-row input[type=range]{accent-color:var(--accent);}

  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(var(--tile-min), 1fr)); gap:12px;}
  .card-tile{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; cursor:pointer; transition:border-color .12s, transform .12s;}
  .card-tile:hover{border-color:var(--accent); transform:translateY(-2px);}
  .card-tile img{width:100%; aspect-ratio:5/7; object-fit:contain; background:#0c0d11; display:block;}
  .card-tile .meta{padding:5px 7px 7px; font-size:10.5px; color:var(--text-faint); font-family:"JetBrains Mono", monospace; display:flex; justify-content:space-between;}

  #loadMoreBtn{display:block; margin:26px auto 0; background:var(--panel-2); border:1px solid var(--line); color:var(--text); padding:10px 26px; border-radius:var(--radius); font-size:13px; cursor:pointer;}
  #loadMoreBtn:hover{border-color:var(--accent);}
  #loadMoreBtn[hidden]{display:none;}
  #loadingMsg, #emptyMsg{text-align:center; color:var(--text-faint); padding:60px 0; font-size:13px;}
  #emptyMsg[hidden], #loadingMsg[hidden]{display:none;}

  #modalOverlay{position:fixed; inset:0; background:rgba(6,7,9,.86); display:none; align-items:flex-start; justify-content:center; padding:30px 16px; overflow-y:auto; z-index:50;}
  #modalOverlay.open{display:flex;}
  #modalBox{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); max-width:620px; width:100%; padding:20px; position:relative;}
  #modalClose{position:absolute; top:10px; right:12px; background:none; border:none; color:var(--text-dim); font-size:20px; cursor:pointer;}
  #modalBody{display:flex; flex-direction:column; gap:0;}
  .card-section{display:flex; flex-direction:column; align-items:center; gap:14px; width:100%;}
  .card-section-img{width:220px; max-width:70%; aspect-ratio:5/7; object-fit:contain; border-radius:var(--radius); background:#0c0d11;}
  .card-section-info{width:100%; font-size:13px;}
  .card-divider{margin:18px 0; padding-top:16px; border-top:2px solid var(--line); width:100%;}
  .card-divider-label{font-size:11px; color:var(--text-faint); margin-bottom:10px;}
  /* PCなど横幅に余裕がある画面では、画像を左に大きく・テキストをその右に配置する。
     表面・裏面どちらも同じ枠組み・同じ画像サイズで統一する。 */
  @media (min-width: 880px){
    #modalBox{max-width:920px;}
    .card-section{flex-direction:row; align-items:flex-start; gap:28px;}
    .card-section-img{width:340px; max-width:42%; flex-shrink:0;}
    .card-section-info{width:auto; flex:1; min-width:0;}
  }
  #modalInfo h2, .card-section-info h2, .card-section-info h3{font-size:17px; margin:0 0 8px;}
  #modalInfo .ability-text, .card-section-info .ability-text{white-space:pre-wrap; color:var(--text); font-size:13px; background:var(--panel-2); padding:10px; border-radius:var(--radius); margin-bottom:10px;}
  #modalInfo .row, .card-section-info .row{display:flex; gap:6px; padding:3px 0; border-bottom:1px solid var(--line); color:var(--text-dim);}
  #modalInfo .row b, .card-section-info .row b{color:var(--text); min-width:78px; font-weight:700;}
  .tag-chip{display:inline-block; background:var(--panel-2); border:1px solid var(--line); color:var(--text-dim); font-size:10.5px; padding:2px 7px; border-radius:10px; margin:2px 4px 2px 0;}
</style>
</head>
<body>

<header class="site">
  <div class="title-row">
    <h1>DM Archive</h1>
    <span class="subtitle">非公式カード検索データベース</span>
  </div>
  <div class="stat-line" id="statLine">読み込み中...</div>
</header>

<div class="layout">
  <button id="filterToggleBtn">絞り込み条件 ▾</button>

  <aside id="filterPanel">
    <div class="facet expanded">
      <div class="facet-head" style="cursor:default;"><h3>表示オプション</h3></div>
      <div class="facet-body" style="display:block;">
        <div class="toggle-row">
          <input type="checkbox" id="dedupeToggle" checked>
          <label for="dedupeToggle">同名カードをまとめて1枚だけ表示（絞り込み条件に一致するもののうち最も古い版を採用）</label>
        </div>
      </div>
    </div>

    <div class="facet expanded">
      <div class="facet-head" data-target="yearBody"><h3>発売年の範囲</h3><span class="caret">▸</span></div>
      <div class="facet-body" id="yearBody">
        <div class="range-row">
          <input type="number" id="yearFrom" placeholder="開始年">
          <span>〜</span>
          <input type="number" id="yearTo" placeholder="終了年">
          <button class="range-reset" data-reset="year">リセット</button>
        </div>
      </div>
    </div>

    <div class="facet expanded">
      <div class="facet-head" data-target="freeTextBody"><h3>フリーワード</h3><span class="caret">▸</span></div>
      <div class="facet-body" id="freeTextBody">
        <div class="input-wrap">
          <input type="text" id="freeText" placeholder="単語をスペース区切りで複数指定可">
          <button class="clear-x" data-clear="freeText">×</button>
        </div>
        <div class="fw-target-row">
          <label><input type="checkbox" id="fwTargetName" checked> カード名</label>
          <label><input type="checkbox" id="fwTargetText" checked> テキスト</label>
          <label><input type="checkbox" id="fwTargetRace"> 種族</label>
        </div>
        <div class="mode-row">
          <span class="mode-label">複数語の場合</span>
          <div class="toggle-switch" id="fwModeToggle"><span class="on" data-val="OR">いずれか</span><span data-val="AND">すべて</span></div>
        </div>
      </div>
    </div>

    <div class="facet">
      <div class="facet-head" data-target="costBody"><h3>コスト</h3><span class="caret">▸</span></div>
      <div class="facet-body" id="costBody">
        <div class="range-row">
          <input type="number" id="costFrom" placeholder="下限">
          <span>〜</span>
          <input type="number" id="costTo" placeholder="上限">
          <button class="range-reset" data-reset="cost">リセット</button>
        </div>
      </div>
    </div>

    <div class="facet">
      <div class="facet-head" data-target="powerBody"><h3>パワー</h3><span class="caret">▸</span></div>
      <div class="facet-body" id="powerBody">
        <div class="range-row">
          <input type="number" id="powerFrom" placeholder="下限">
          <span>〜</span>
          <input type="number" id="powerTo" placeholder="上限">
          <button class="range-reset" data-reset="power">リセット</button>
        </div>
      </div>
    </div>

    <div class="facet">
      <div class="facet-head" data-target="civBody"><h3>文明</h3><span class="caret">▸</span></div>
      <div class="facet-body" id="civBody">
        <div class="colorcount-row" id="colorCountRow">
          <button data-mode="any" class="active">指定なし</button>
          <button data-mode="mono">単色のみ</button>
          <button data-mode="multi">多色のみ</button>
        </div>
        <div class="civ-row" id="civRow"></div>
        <div style="font-size:10.5px; color:var(--text-faint);">クリックで 指定なし→含む→含まない を切替</div>
      </div>
    </div>

    <div id="facetContainer"><!-- cardType / race / rarity / ability / series / product / illustrator --></div>

    <button id="resetBtn">条件をすべてリセット</button>
  </aside>

  <main>
    <div class="result-head">
      <div id="resultCount">-</div>
      <div class="display-controls">
        <select id="sortKey">
          <option value="release">発売順</option>
          <option value="name">カード名順</option>
          <option value="cost">コスト順</option>
          <option value="power">パワー順</option>
        </select>
        <button id="sortDirBtn" class="dir-btn">▲昇順</button>
        <div class="size-row">
          <label for="sizeSlider">表示サイズ</label>
          <input type="range" id="sizeSlider" min="100" max="240" step="10">
        </div>
      </div>
    </div>
    <div id="loadingMsg">データベースを読み込んでいます...</div>
    <div id="emptyMsg" hidden>条件に一致するカードが見つかりませんでした。</div>
    <div class="grid" id="grid"></div>
    <button id="loadMoreBtn" hidden>さらに表示する</button>
  </main>
</div>

<div id="modalOverlay">
  <div id="modalBox">
    <button id="modalClose">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script>
(function(){
  "use strict";

  const DB_PATH = "./duelmasters.db";
  const PAGE_SIZE = 60;
  const LS_KEY = "dmArchivePrefs";

  const CIV_COLOR = { "光":"var(--civ-hikari)", "水":"var(--civ-mizu)", "闇":"var(--civ-yami)", "火":"var(--civ-hi)", "自然":"var(--civ-shizen)", "ゼロ":"var(--civ-zero)" };
  const CIV_ORDER = ["光","水","闇","火","自然","ゼロ"];
  const RARITY_ORDER = ["-","C","U","R","VR","SR","VIC"];

  // カードの種類の統合ルール。今後似た名前の種類が増えた場合は、ここに追記していく方針。
  // 1) 「進化クリーチャー(◯◯)」「進化クリーチャー（◯◯）」系統は、丸括弧部分を除去して
  //    すべて「進化クリーチャー」に統合する（下の関数で自動処理）。
  // 2) それ以外の特殊な派生名は、下記の対応表で個別に派生元へ統合する。
  const CARD_TYPE_MERGE_MAP = {
    "サイキック・スーパー・クリーチャー": "サイキック・クリーチャー",
    "進化エグザイル・クリーチャー": "エグザイル・クリーチャー",
    "進化クロスギア": "クロスギア",
  };
  function normalizeCardType(t){
    if(!t) return t;
    // 丸括弧(半角/全角)とその中身を除去
    let out = t.replace(/[（(][^）)]*[）)]/g, "");
    if(CARD_TYPE_MERGE_MAP[out]) out = CARD_TYPE_MERGE_MAP[out];
    return out;
  }

  let ALL_CARDS = [];
  let FACET_DEFS = [];
  let SERIES_ORDER = [];   // シリーズ名を発売順に並べた配列
  let PRODUCT_CHRONO = {}; // product_code -> release_year (商品名欄の並び替え用)

  let filters = {
    yearFrom:null, yearTo:null, dedupe:true,
    freeText:"", fwTargets:{name:true, text:true, race:false}, fwMode:"OR",
    cost:{from:null,to:null}, power:{from:null,to:null},
    civ:{ include:new Set(), exclude:new Set(), colorCountMode:"any" },
    facets:{}
  };
  let display = { sortKey:"release", sortDir:"asc", tileSize:150 };
  let visibleCount = PAGE_SIZE;
  let currentFilteredCards = [];

  // ---------- persistence ----------
  function savePrefs(){
    try{
      const facetsOut = {};
      Object.keys(filters.facets).forEach(k=>{
        const f = filters.facets[k];
        facetsOut[k] = { selected:Array.from(f.selected), mode:f.mode, useChrono:!!f.useChrono };
      });
      const data = {
        sortKey:display.sortKey, sortDir:display.sortDir, tileSize:display.tileSize,
        filters: {
          yearFrom:filters.yearFrom, yearTo:filters.yearTo, dedupe:filters.dedupe,
          freeText:filters.freeText, fwTargets:filters.fwTargets, fwMode:filters.fwMode,
          cost:filters.cost, power:filters.power,
          civ:{ include:Array.from(filters.civ.include), exclude:Array.from(filters.civ.exclude), colorCountMode:filters.civ.colorCountMode },
          facets: facetsOut,
        },
      };
      localStorage.setItem(LS_KEY, JSON.stringify(data));
    }catch(e){}
  }
  function loadPrefs(){
    try{
      const raw = localStorage.getItem(LS_KEY);
      if(!raw) return;
      const p = JSON.parse(raw);
      if(p.sortKey) display.sortKey = p.sortKey;
      if(p.sortDir) display.sortDir = p.sortDir;
      if(p.tileSize) display.tileSize = p.tileSize;
    }catch(e){}
  }
  // buildFacetDefs()でfilters.facetsの雛形ができた後に呼び出し、保存されていた
  // 絞り込み条件を復元する。ページ内容(DB)を読み込む前は復元できないため、
  // boot()の中でこのタイミングまで待つ必要がある。
  function loadSavedFilters(){
    try{
      const raw = localStorage.getItem(LS_KEY);
      if(!raw) return;
      const p = JSON.parse(raw);
      const f = p.filters;
      if(!f) return;
      filters.yearFrom = f.yearFrom ?? null;
      filters.yearTo = f.yearTo ?? null;
      filters.dedupe = f.dedupe !== undefined ? f.dedupe : true;
      filters.freeText = f.freeText || "";
      filters.fwTargets = f.fwTargets || {name:true, text:true, race:false};
      filters.fwMode = f.fwMode || "OR";
      filters.cost = f.cost || {from:null, to:null};
      filters.power = f.power || {from:null, to:null};
      if(f.civ){
        filters.civ.include = new Set(f.civ.include||[]);
        filters.civ.exclude = new Set(f.civ.exclude||[]);
        filters.civ.colorCountMode = f.civ.colorCountMode || "any";
      }
      if(f.facets){
        Object.keys(f.facets).forEach(k=>{
          if(filters.facets[k]){
            filters.facets[k].selected = new Set(f.facets[k].selected||[]);
            filters.facets[k].mode = f.facets[k].mode || "OR";
            filters.facets[k].useChrono = !!f.facets[k].useChrono;
          }
        });
      }
    }catch(e){}
  }
  // buildFacetPanelDOM()/buildCivRow()でDOMを再構築した『後』、通常のHTMLに
  // 静的に存在する入力欄（年代・コスト・パワー・フリーワード等）の表示だけは
  // 別途、現在のfiltersの値に合わせて手動で同期させる必要がある。
  function syncStaticInputsFromFilters(){
    document.getElementById("yearFrom").value = filters.yearFrom ?? "";
    document.getElementById("yearTo").value = filters.yearTo ?? "";
    document.getElementById("dedupeToggle").checked = filters.dedupe;
    document.getElementById("freeText").value = filters.freeText;
    document.getElementById("fwTargetName").checked = filters.fwTargets.name;
    document.getElementById("fwTargetText").checked = filters.fwTargets.text;
    document.getElementById("fwTargetRace").checked = filters.fwTargets.race;
    document.getElementById("costFrom").value = filters.cost.from ?? "";
    document.getElementById("costTo").value = filters.cost.to ?? "";
    document.getElementById("powerFrom").value = filters.power.from ?? "";
    document.getElementById("powerTo").value = filters.power.to ?? "";

    const fwSw = document.getElementById("fwModeToggle");
    fwSw.querySelectorAll("span").forEach(s=>s.classList.toggle("on", s.dataset.val===filters.fwMode));

    document.querySelectorAll("#colorCountRow button").forEach(b=>{
      b.classList.toggle("active", b.dataset.mode===filters.civ.colorCountMode);
    });

    document.querySelectorAll(".toggle-switch[data-mode]").forEach(sw=>{
      const key = sw.dataset.mode;
      const mode = filters.facets[key] ? filters.facets[key].mode : "OR";
      sw.querySelectorAll("span").forEach(s=>s.classList.toggle("on", s.dataset.val===mode));
    });
    document.querySelectorAll(".toggle-switch[data-chrono]").forEach(sw=>{
      const key = sw.dataset.chrono;
      const val = filters.facets[key] ? !!filters.facets[key].useChrono : false;
      sw.querySelectorAll("span").forEach(s=>s.classList.toggle("on", s.dataset.val===String(val)));
    });
  }

  // ---------- utils ----------
  function toHiragana(s){ return s.replace(/[\u30a1-\u30f6]/g, ch => String.fromCharCode(ch.charCodeAt(0)-0x60)); }
  function normalizeText(s){ return toHiragana((s||"").replace(/[・･]/g, "")).toLowerCase(); }
  function parseCode(code){
    const m = /^([A-Za-z]+)-?(\d+)([A-Za-z]*)$/.exec(code || "");
    if(!m) return {prefix:code||"", num:0, suffix:""};
    return {prefix:m[1], num:parseInt(m[2],10), suffix:m[3]};
  }
  function compareCode(a,b){
    const pa=parseCode(a), pb=parseCode(b);
    if(pa.prefix!==pb.prefix) return pa.prefix<pb.prefix?-1:1;
    if(pa.num!==pb.num) return pa.num-pb.num;
    return pa.suffix<pb.suffix?-1:(pa.suffix>pb.suffix?1:0);
  }
  // カード番号（例: '41/110', 'S5/S7', '4a/55'）を比較する。
  // '/'より前の部分だけを見て、先頭の文字プレフィックス→数字→末尾の
  // 文字サフィックスの順で比較する（'/'より後ろは総収録数なので無視する）。
  function parseCardNumber(numStr){
    if(!numStr) return {prefix:"", num:0, suffix:""};
    const left = String(numStr).split("/")[0];
    const m = /^([^\d]*)(\d+)(.*)$/.exec(left);
    if(!m) return {prefix:left, num:0, suffix:""};
    return {prefix:m[1], num:parseInt(m[2],10), suffix:m[3]};
  }
  function compareCardNumber(a,b){
    const pa=parseCardNumber(a), pb=parseCardNumber(b);
    if(pa.prefix!==pb.prefix) return pa.prefix<pb.prefix?-1:1;
    if(pa.num!==pb.num) return pa.num-pb.num;
    return pa.suffix<pb.suffix?-1:(pa.suffix>pb.suffix?1:0);
  }
  function uniqSorted(arr){
    return Array.from(new Set(arr.filter(v=>v!==null && v!==undefined && v!=="")))
      .sort((a,b)=> String(a).localeCompare(String(b),'ja'));
  }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  // 画像読み込み失敗時の処理。
  // 実機確認の結果、通常のカードは {card_id}.jpg だが、"V"から始まる特殊な
  // カード番号を持つカード（例: dmr02-v01、ヴォルグ・サンダー等）は、実際の
  // 画像ファイル名が {card_id}a.jpg（末尾に'a'が付く）であることが判明した。
  // そのため、最初の失敗時は速攻でこの'a'付きファイル名を試す。
  // それでも失敗する場合は、外部サイトからの参照元(Referrer)チェックによる
  // 一時的な制限の可能性を考慮し、キャッシュを避けて再読み込みを試みる。
  // 最終的に失敗が続く場合はプレースホルダー表示に切り替える。
  window.handleImgError = function(img){
    const stage = parseInt(img.dataset.stage || "0", 10);
    const baseSrc = img.dataset.baseSrc || img.src.replace(/\?.*$/, "");
    img.dataset.baseSrc = baseSrc;

    if(stage === 0){
      img.dataset.stage = "1";
      img.src = baseSrc.replace(/\.jpg$/i, "a.jpg");
    } else if(stage < 3){
      img.dataset.stage = String(stage + 1);
      setTimeout(()=>{ img.src = baseSrc + "?retry=" + Date.now(); }, 400 * stage);
    } else {
      img.onerror = null;
      img.style.objectFit = "none";
      img.alt = "画像読み込み失敗: " + img.alt;
      img.style.background = "#2a1414";
    }
  };

  // ---------- boot ----------
  async function boot(){
    loadPrefs();
    try{
      const SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${f}` });
      const resp = await fetch(DB_PATH);
      if(!resp.ok) throw new Error("db fetch failed: " + resp.status);
      const buf = await resp.arrayBuffer();
      const db = new SQL.Database(new Uint8Array(buf));

      loadCards(db);
      buildSeriesOrder(db);
      buildFacetDefs();
      loadSavedFilters();
      buildFacetPanelDOM();
      buildCivRow();
      syncStaticInputsFromFilters();
      attachGlobalListeners();
      applySavedDisplayToControls();
      applyFiltersAndRender();

      document.getElementById("loadingMsg").hidden = true;
      const statEl = document.getElementById("statLine");
      statEl.textContent = `全 ${ALL_CARDS.length.toLocaleString()} 枚 / 発売年 ${minYear()}〜${maxYear()}年を収録`;
      if(statEl.dataset.legacyWarning){
        statEl.textContent += "（旧形式のDBのため、サイキック・クリーチャー等の裏面情報は表示されません。最新のduelmasters.dbに差し替えてください）";
      }
    }catch(err){
      console.error(err);
      document.getElementById("loadingMsg").textContent =
        "読み込みに失敗しました。ローカルで直接HTMLファイルを開いている場合、ブラウザのセキュリティ制限でdbファイルを読み込めないことがあります。簡易サーバー（例: python -m http.server）経由で開くか、GitHub Pages等で公開してからお試しください。詳細: " + err.message;
    }
  }

  function minYear(){ return ALL_CARDS.reduce((m,c)=> c.release_year && c.release_year<m ? c.release_year : m, 9999); }
  function maxYear(){ return ALL_CARDS.reduce((m,c)=> c.release_year && c.release_year>m ? c.release_year : m, 0); }

  function loadCards(db){
    const FULL_QUERY = `
      SELECT c.card_id, c.card_name, c.product_code, c.card_number, c.civilization,
             c.card_type, c.rarity, c.cost, c.power, c.ability_text, c.flavor_text,
             c.image_url, c.thumb_url,
             c.has_back_side, c.back_card_name, c.back_civilization, c.back_card_type,
             c.back_rarity, c.back_cost, c.back_power, c.back_race,
             c.back_ability_text, c.back_flavor_text, c.back_image_url,
             p.product_name, p.release_year, p.series
      FROM cards c LEFT JOIN products p ON c.product_code = p.product_code
    `;
    // 裏面カード対応(has_back_side等)より前の古い形式のduelmasters.dbが
    // 読み込まれた場合に備え、失敗したら裏面列を含まないクエリで再試行する。
    // これにより、DBとindex.htmlのバージョンが行き違っていても、
    // 完全に読み込み失敗にはならず、裏面情報だけが無い状態で動作を続けられる。
    const LEGACY_QUERY = `
      SELECT c.card_id, c.card_name, c.product_code, c.card_number, c.civilization,
             c.card_type, c.rarity, c.cost, c.power, c.ability_text, c.flavor_text,
             c.image_url, c.thumb_url,
             p.product_name, p.release_year, p.series
      FROM cards c LEFT JOIN products p ON c.product_code = p.product_code
    `;

    let cardRows;
    let hasBackColumns = true;
    try{
      cardRows = db.exec(FULL_QUERY)[0];
    }catch(e){
      console.warn("裏面カード対応列が無い古い形式のDBのようです。裏面情報なしで読み込みます:", e.message);
      hasBackColumns = false;
      cardRows = db.exec(LEGACY_QUERY)[0];
    }

    const racesByCard = groupByCardId(db, "SELECT card_id, race FROM card_races", "race");
    const abilitiesByCard = groupByCardId(db, "SELECT card_id, ability FROM card_abilities", "ability");
    const illustByCard = groupByCardId(db, "SELECT card_id, illustrator FROM card_illustrators", "illustrator");

    if(!cardRows) { ALL_CARDS = []; return; }
    const cols = cardRows.columns;
    ALL_CARDS = cardRows.values.map(row=>{
      const o = {};
      cols.forEach((c,i)=> o[c]=row[i]);
      if(!hasBackColumns) o.has_back_side = 0;
      o.civilizations = (o.civilization||"").split("/").filter(Boolean);
      o.races = racesByCard[o.card_id] || [];
      o.abilities = abilitiesByCard[o.card_id] || [];
      o.illustrators = illustByCard[o.card_id] || [];
      o.card_type_norm = normalizeCardType(o.card_type);
      o._nameNorm = normalizeText(o.card_name);
      o._abilityNorm = normalizeText(o.ability_text);
      o._raceNorm = normalizeText(o.races.join(" "));
      PRODUCT_CHRONO[o.product_code] = o.release_year;
      return o;
    });

    if(!hasBackColumns){
      document.getElementById("statLine").dataset.legacyWarning = "1";
    }
  }

  function groupByCardId(db, sql, valueCol){
    const res = db.exec(sql)[0];
    const map = {};
    if(!res) return map;
    const idIdx = res.columns.indexOf("card_id");
    const valIdx = res.columns.indexOf(valueCol);
    res.values.forEach(row=>{
      const id = row[idIdx], val = row[valIdx];
      if(!map[id]) map[id]=[];
      if(val) map[id].push(val);
    });
    return map;
  }

  function buildSeriesOrder(db){
    const res = db.exec(`
      SELECT series, MIN(release_year) y FROM products
      WHERE series IS NOT NULL AND series != '' GROUP BY series ORDER BY y ASC
    `)[0];
    SERIES_ORDER = res ? res.values.map(r=>r[0]) : [];
  }

  // ---------- facet definitions ----------
  function buildFacetDefs(){
    FACET_DEFS = [
      { key:"cardType", label:"カードの種類", getValues:c=>c.card_type_norm?[c.card_type_norm]:[], sortMode:"count" },
      { key:"rarity", label:"レアリティ", getValues:c=>c.rarity?[c.rarity]:[], sortMode:"custom", customOrder:RARITY_ORDER },
      { key:"race", label:"種族", getValues:c=>c.races, sortMode:"alpha", searchable:true },
      { key:"ability", label:"特殊能力", getValues:c=>c.abilities, sortMode:"count", searchable:true },
      { key:"series", label:"シリーズ", getValues:c=>c.series?[c.series]:[], sortMode:"custom", customOrder:SERIES_ORDER, hideModeToggle:true },
      { key:"product", label:"商品名（弾）", getValues:c=>c.product_code?[c.product_code]:[],
        labelFor:v=>{ const c=ALL_CARDS.find(x=>x.product_code===v); return v + (c&&c.product_name ? "｜"+c.product_name : ""); },
        sortMode:"alpha", searchable:true, chronoToggle:true, hideModeToggle:true },
      { key:"illustrator", label:"イラストレーター", getValues:c=>c.illustrators, sortMode:"alpha", searchable:true },
    ];
    FACET_DEFS.forEach(def=>{
      filters.facets[def.key] = { selected:new Set(), mode:"OR", search:"", useChrono:false };
    });
  }

  function facetOptionCounts(def){
    const counts = {};
    ALL_CARDS.forEach(c=>{ def.getValues(c).forEach(v=>{ counts[v]=(counts[v]||0)+1; }); });
    let keys = Object.keys(counts);
    const state = filters.facets[def.key];

    if(def.key==="product" && state.useChrono){
      keys.sort((a,b)=> (PRODUCT_CHRONO[a]||9999)-(PRODUCT_CHRONO[b]||9999) || compareCode(a,b));
    } else if(def.sortMode==="count"){
      keys.sort((a,b)=> counts[b]-counts[a]);
    } else if(def.sortMode==="custom" && def.customOrder){
      const order = def.customOrder;
      keys.sort((a,b)=>{
        const ia=order.indexOf(a), ib=order.indexOf(b);
        if(ia===-1 && ib===-1) return String(a).localeCompare(String(b),'ja');
        if(ia===-1) return 1;
        if(ib===-1) return -1;
        return ia-ib;
      });
    } else {
      keys = uniqSorted(keys);
    }
    return keys.map(k=>({value:k, count:counts[k]}));
  }

  // ---------- DOM: civilization ----------
  function buildCivRow(){
    const row = document.getElementById("civRow");
    row.innerHTML = CIV_ORDER.map(c=>{
      const state = filters.civ.include.has(c) ? "include" : (filters.civ.exclude.has(c) ? "exclude" : "neutral");
      return `<div class="civ-chip" data-civ="${c}" data-state="${state}" style="--chip-color:${CIV_COLOR[c]}">${c}</div>`;
    }).join("");
  }

  // ---------- DOM: facet panel ----------
  function buildFacetPanelDOM(){
    const container = document.getElementById("facetContainer");
    container.innerHTML = "";
    FACET_DEFS.forEach(def=>{
      const wrap = document.createElement("div");
      wrap.className = "facet";
      wrap.innerHTML = `
        <div class="facet-head" data-target="body_${def.key}"><h3>${def.label}</h3><span class="caret">▸</span></div>
        <div class="facet-body" id="body_${def.key}">
          ${def.searchable ? `<div class="input-wrap facet-search"><input type="text" data-key="${def.key}" placeholder="${def.label}を検索..."><button class="clear-x" data-facet-clear="${def.key}">×</button></div>` : ""}
          ${def.chronoToggle ? `<div class="mode-row"><span class="mode-label">並び順</span><div class="toggle-switch" data-chrono="${def.key}"><span class="on" data-val="false">通常</span><span data-val="true">発売順</span></div></div>` : ""}
          ${def.hideModeToggle ? "" : `<div class="mode-row"><span class="mode-label">複数選択時</span><div class="toggle-switch" data-mode="${def.key}"><span class="on" data-val="OR">いずれか</span><span data-val="AND">すべて</span></div></div>`}
          <div class="select-all-row"><button data-selall="${def.key}">すべて選択</button><button data-deselall="${def.key}">すべて解除</button></div>
          <div class="facet-options" id="options_${def.key}"></div>
        </div>
      `;
      container.appendChild(wrap);
      renderFacetOptions(def);
    });
  }

  function renderFacetOptions(def){
    const box = document.getElementById("options_"+def.key);
    const opts = facetOptionCounts(def);
    const q = normalizeText(filters.facets[def.key].search);
    const filtered = q ? opts.filter(o=> normalizeText(def.labelFor?def.labelFor(o.value):o.value).includes(q)) : opts;
    box.innerHTML = filtered.map(o=>{
      const id = "opt_"+def.key+"_"+btoa(unescape(encodeURIComponent(o.value))).replace(/[^a-zA-Z0-9]/g,"");
      const checked = filters.facets[def.key].selected.has(o.value) ? "checked" : "";
      const label = def.labelFor ? def.labelFor(o.value) : o.value;
      return `<div class="facet-option">
        <input type="checkbox" id="${id}" data-key="${def.key}" data-value="${escapeHtml(o.value)}" ${checked}>
        <label for="${id}">${escapeHtml(label)}</label>
        <span class="n">${o.count}</span>
      </div>`;
    }).join("");
  }

  // ---------- listeners ----------
  function attachGlobalListeners(){
    document.getElementById("filterToggleBtn").addEventListener("click", ()=>{
      document.getElementById("filterPanel").classList.toggle("open");
    });

    document.addEventListener("click", (e)=>{
      const head = e.target.closest(".facet-head");
      if(head){ head.closest(".facet").classList.toggle("expanded"); return; }

      const civChip = e.target.closest(".civ-chip");
      if(civChip){
        const civ = civChip.dataset.civ;
        const cur = civChip.dataset.state;
        const next = cur==="neutral" ? "include" : (cur==="include" ? "exclude" : "neutral");
        civChip.dataset.state = next;
        filters.civ.include.delete(civ); filters.civ.exclude.delete(civ);
        if(next==="include") filters.civ.include.add(civ);
        if(next==="exclude") filters.civ.exclude.add(civ);
        applyFiltersAndRender();
        return;
      }
      const ccBtn = e.target.closest("#colorCountRow button");
      if(ccBtn){
        filters.civ.colorCountMode = ccBtn.dataset.mode;
        document.querySelectorAll("#colorCountRow button").forEach(b=>b.classList.toggle("active", b===ccBtn));
        applyFiltersAndRender();
        return;
      }

      const modeSw = e.target.closest(".toggle-switch[data-mode]");
      if(modeSw){
        const key = modeSw.dataset.mode;
        const cur = filters.facets[key].mode;
        const next = cur==="OR" ? "AND" : "OR";
        filters.facets[key].mode = next;
        modeSw.querySelectorAll("span").forEach(s=>s.classList.toggle("on", s.dataset.val===next));
        applyFiltersAndRender();
        return;
      }
      const chronoSw = e.target.closest(".toggle-switch[data-chrono]");
      if(chronoSw){
        const key = chronoSw.dataset.chrono;
        const cur = filters.facets[key].useChrono;
        const next = !cur;
        filters.facets[key].useChrono = next;
        chronoSw.querySelectorAll("span").forEach(s=>s.classList.toggle("on", s.dataset.val===String(next)));
        renderFacetOptions(FACET_DEFS.find(d=>d.key===key));
        return;
      }
      const fwModeSw = e.target.closest("#fwModeToggle");
      if(fwModeSw){
        const next = filters.fwMode==="OR" ? "AND" : "OR";
        filters.fwMode = next;
        fwModeSw.querySelectorAll("span").forEach(s=>s.classList.toggle("on", s.dataset.val===next));
        applyFiltersAndRender();
        return;
      }

      const selAll = e.target.closest("[data-selall]");
      if(selAll){
        const def = FACET_DEFS.find(d=>d.key===selAll.dataset.selall);
        facetOptionCounts(def).forEach(o=>filters.facets[def.key].selected.add(o.value));
        renderFacetOptions(def); applyFiltersAndRender();
        return;
      }
      const deselAll = e.target.closest("[data-deselall]");
      if(deselAll){
        filters.facets[deselAll.dataset.deselall].selected.clear();
        renderFacetOptions(FACET_DEFS.find(d=>d.key===deselAll.dataset.deselall)); applyFiltersAndRender();
        return;
      }

      const clearX = e.target.closest(".clear-x");
      if(clearX){
        if(clearX.dataset.clear==="freeText"){ document.getElementById("freeText").value=""; filters.freeText=""; applyFiltersAndRender(); }
        if(clearX.dataset.facetClear){
          const key = clearX.dataset.facetClear;
          filters.facets[key].search = "";
          const input = document.querySelector(`.facet-search input[data-key="${key}"]`);
          if(input) input.value="";
          renderFacetOptions(FACET_DEFS.find(d=>d.key===key));
        }
        return;
      }
      const rangeReset = e.target.closest(".range-reset");
      if(rangeReset){
        const which = rangeReset.dataset.reset;
        if(which==="year"){ filters.yearFrom=null; filters.yearTo=null; document.getElementById("yearFrom").value=""; document.getElementById("yearTo").value=""; }
        if(which==="cost"){ filters.cost={from:null,to:null}; document.getElementById("costFrom").value=""; document.getElementById("costTo").value=""; }
        if(which==="power"){ filters.power={from:null,to:null}; document.getElementById("powerFrom").value=""; document.getElementById("powerTo").value=""; }
        applyFiltersAndRender();
        return;
      }
      const sortDirBtn = e.target.closest("#sortDirBtn");
      if(sortDirBtn){
        display.sortDir = display.sortDir==="asc" ? "desc" : "asc";
        sortDirBtn.textContent = display.sortDir==="asc" ? "▲昇順" : "▼降順";
        savePrefs(); applyFiltersAndRender();
        return;
      }
    });

    document.addEventListener("change", (e)=>{
      if(e.target.matches(".facet-options input[type=checkbox]")){
        const key = e.target.dataset.key, val = e.target.dataset.value;
        const set = filters.facets[key].selected;
        if(e.target.checked) set.add(val); else set.delete(val);
        applyFiltersAndRender();
      }
      if(e.target.id==="dedupeToggle"){ filters.dedupe = e.target.checked; applyFiltersAndRender(); }
      if(e.target.id==="fwTargetName"){ filters.fwTargets.name = e.target.checked; applyFiltersAndRender(); }
      if(e.target.id==="fwTargetText"){ filters.fwTargets.text = e.target.checked; applyFiltersAndRender(); }
      if(e.target.id==="fwTargetRace"){ filters.fwTargets.race = e.target.checked; applyFiltersAndRender(); }
      if(e.target.id==="sortKey"){ display.sortKey = e.target.value; savePrefs(); applyFiltersAndRender(); }
      if(e.target.id==="sizeSlider"){ display.tileSize = parseInt(e.target.value,10); document.documentElement.style.setProperty("--tile-min", display.tileSize+"px"); savePrefs(); }
    });

    let debounceTimer = null;
    function debouncedApply(){
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(applyFiltersAndRender, 280);
    }

    document.addEventListener("input", (e)=>{
      if(e.target.matches(".facet-search input[type=text]")){
        const key = e.target.dataset.key;
        filters.facets[key].search = e.target.value;
        renderFacetOptions(FACET_DEFS.find(d=>d.key===key));
      }
      if(e.target.id==="freeText"){ filters.freeText = e.target.value; debouncedApply(); }
      if(e.target.id==="yearFrom"){ filters.yearFrom = e.target.value?parseInt(e.target.value,10):null; debouncedApply(); }
      if(e.target.id==="yearTo"){ filters.yearTo = e.target.value?parseInt(e.target.value,10):null; debouncedApply(); }
      if(e.target.id==="costFrom"){ filters.cost.from = e.target.value?parseInt(e.target.value,10):null; debouncedApply(); }
      if(e.target.id==="costTo"){ filters.cost.to = e.target.value?parseInt(e.target.value,10):null; debouncedApply(); }
      if(e.target.id==="powerFrom"){ filters.power.from = e.target.value?parseInt(e.target.value,10):null; debouncedApply(); }
      if(e.target.id==="powerTo"){ filters.power.to = e.target.value?parseInt(e.target.value,10):null; debouncedApply(); }
      if(e.target.id==="sizeSlider"){ display.tileSize = parseInt(e.target.value,10); document.documentElement.style.setProperty("--tile-min", display.tileSize+"px"); }
    });

    document.getElementById("resetBtn").addEventListener("click", ()=>{
      filters.yearFrom=null; filters.yearTo=null; filters.dedupe=true; filters.freeText="";
      filters.fwTargets={name:true,text:true,race:false}; filters.fwMode="OR";
      filters.cost={from:null,to:null}; filters.power={from:null,to:null};
      filters.civ={include:new Set(), exclude:new Set(), colorCountMode:"any"};
      Object.values(filters.facets).forEach(f=>{ f.selected=new Set(); f.mode="OR"; f.search=""; f.useChrono=false; });
      document.querySelectorAll("#filterPanel input[type=text], #filterPanel input[type=number]").forEach(i=>i.value="");
      document.getElementById("dedupeToggle").checked = true;
      document.getElementById("fwTargetName").checked = true;
      document.getElementById("fwTargetText").checked = true;
      document.getElementById("fwTargetRace").checked = false;
      buildCivRow();
      document.querySelectorAll("#colorCountRow button").forEach(b=>b.classList.toggle("active", b.dataset.mode==="any"));
      document.querySelectorAll(".toggle-switch").forEach(sw=>{
        sw.querySelectorAll("span").forEach((s,i)=>s.classList.toggle("on", i===0));
      });
      buildFacetPanelDOM();
      applyFiltersAndRender();
    });

    document.getElementById("loadMoreBtn").addEventListener("click", ()=>{ visibleCount += PAGE_SIZE; renderGrid(currentFilteredCards); });

    document.getElementById("grid").addEventListener("click", (e)=>{
      const tile = e.target.closest(".card-tile");
      if(tile) openModal(tile.dataset.cardId);
    });
    document.getElementById("modalClose").addEventListener("click", closeModal);
    document.getElementById("modalOverlay").addEventListener("click", (e)=>{ if(e.target.id==="modalOverlay") closeModal(); });
  }

  function applySavedDisplayToControls(){
    document.getElementById("sortKey").value = display.sortKey;
    document.getElementById("sortDirBtn").textContent = display.sortDir==="asc" ? "▲昇順" : "▼降順";
    document.getElementById("sizeSlider").value = display.tileSize;
    document.documentElement.style.setProperty("--tile-min", display.tileSize+"px");
  }

  // ---------- filtering ----------
  function matchesFacet(card, def, state){
    if(state.selected.size===0) return true;
    const values = def.getValues(card);
    if(state.mode==="AND"){ for(const v of state.selected) if(!values.includes(v)) return false; return true; }
    for(const v of state.selected) if(values.includes(v)) return true;
    return false;
  }
  function matchesCiv(card){
    const civs = card.civilizations;
    if(filters.civ.colorCountMode==="mono" && civs.length!==1) return false;
    if(filters.civ.colorCountMode==="multi" && civs.length<2) return false;
    for(const ex of filters.civ.exclude) if(civs.includes(ex)) return false;
    if(filters.civ.include.size>0){
      let ok=true;
      for(const inc of filters.civ.include) if(!civs.includes(inc)){ ok=false; break; }
      if(!ok) return false;
    }
    return true;
  }
  function matchesFreeText(card){
    if(!filters.freeText.trim()) return true;
    const terms = filters.freeText.trim().split(/[\s\u3000]+/).filter(Boolean).map(normalizeText);
    if(terms.length===0) return true;
    const targets = [];
    if(filters.fwTargets.name) targets.push(card._nameNorm);
    if(filters.fwTargets.text) targets.push(card._abilityNorm);
    if(filters.fwTargets.race) targets.push(card._raceNorm);
    if(targets.length===0) return true;
    const termMatches = t => targets.some(tx => tx.includes(t));
    return filters.fwMode==="AND" ? terms.every(termMatches) : terms.some(termMatches);
  }

  function sortCards(list){
    const dir = display.sortDir==="asc" ? 1 : -1;
    const arr = list.slice();
    arr.sort((a,b)=>{
      let r=0;
      if(display.sortKey==="release"){
        r = (a.release_year||0)-(b.release_year||0);
        if(r===0) r = compareCode(a.product_code,b.product_code);
        if(r===0) r = compareCardNumber(a.card_number, b.card_number);
      } else if(display.sortKey==="name"){
        r = String(a.card_name||"").localeCompare(String(b.card_name||""),'ja');
      } else if(display.sortKey==="cost"){
        r = (a.cost==null?-1:a.cost)-(b.cost==null?-1:b.cost);
      } else if(display.sortKey==="power"){
        r = (a.power==null?-1:a.power)-(b.power==null?-1:b.power);
      }
      return r*dir;
    });
    return arr;
  }

  function applyFiltersAndRender(){
    let list = ALL_CARDS.filter(c=>{
      if(filters.yearFrom!=null && (c.release_year==null || c.release_year<filters.yearFrom)) return false;
      if(filters.yearTo!=null && (c.release_year==null || c.release_year>filters.yearTo)) return false;
      if(filters.cost.from!=null && (c.cost==null || c.cost<filters.cost.from)) return false;
      if(filters.cost.to!=null && (c.cost==null || c.cost>filters.cost.to)) return false;
      if(filters.power.from!=null && (c.power==null || c.power<filters.power.from)) return false;
      if(filters.power.to!=null && (c.power==null || c.power>filters.power.to)) return false;
      if(!matchesFreeText(c)) return false;
      if(!matchesCiv(c)) return false;
      for(const def of FACET_DEFS){ if(!matchesFacet(c, def, filters.facets[def.key])) return false; }
      return true;
    });

    if(filters.dedupe){
      const byName = new Map();
      list.forEach(c=>{
        const existing = byName.get(c.card_name);
        if(!existing){ byName.set(c.card_name, c); return; }
        if(c.release_year < existing.release_year ||
           (c.release_year===existing.release_year && compareCode(c.product_code, existing.product_code)<0)){
          byName.set(c.card_name, c);
        }
      });
      list = Array.from(byName.values());
    }

    list = sortCards(list);
    currentFilteredCards = list;
    visibleCount = PAGE_SIZE;
    document.getElementById("resultCount").innerHTML = `<b>${list.length.toLocaleString()}</b> 枚が該当`;
    renderGrid(list);
    savePrefs();
  }

  function renderGrid(list){
    const grid = document.getElementById("grid");
    const slice = list.slice(0, visibleCount);
    grid.innerHTML = slice.map(c=>`
      <div class="card-tile" data-card-id="${c.card_id}">
        <img src="${c.thumb_url}" alt="${escapeHtml(c.card_name)}" loading="lazy" referrerpolicy="no-referrer" onerror="handleImgError(this)">
        <div class="meta"><span>${c.release_year||"?"}</span><span>${escapeHtml((c.product_code||"")+" "+(c.card_number||""))}</span></div>
      </div>
    `).join("");
    document.getElementById("emptyMsg").hidden = list.length>0;
    document.getElementById("loadMoreBtn").hidden = visibleCount>=list.length;
  }

  function renderCardSection(imgUrl, name, abilityText, rows){
    const rowsHtml = rows.map(([label, value]) => `<div class="row"><b>${escapeHtml(label)}</b><span>${value}</span></div>`).join("");
    return `
      <div class="card-section">
        <img class="card-section-img" src="${imgUrl||""}" alt="${escapeHtml(name||"")}" referrerpolicy="no-referrer" onerror="handleImgError(this)">
        <div class="card-section-info">
          <h3>${escapeHtml(name||"-")}</h3>
          <div class="ability-text">${escapeHtml(abilityText || "（能力テキストなし）")}</div>
          ${rowsHtml}
        </div>
      </div>
    `;
  }

  function openModal(cardId){
    const c = ALL_CARDS.find(x=>String(x.card_id)===String(cardId));
    if(!c) return;
    const tags = [
      ...c.civilizations.map(v=>`<span class="tag-chip">${escapeHtml(v)}</span>`),
      ...c.races.map(v=>`<span class="tag-chip">${escapeHtml(v)}</span>`),
      ...c.abilities.map(v=>`<span class="tag-chip">${escapeHtml(v)}</span>`),
    ].join("");

    const frontRows = [
      ["商品", `${escapeHtml(c.product_code||"")} ${escapeHtml(c.product_name||"")}`],
      ["カード番号", escapeHtml(c.card_number||"-")],
      ["発売年", c.release_year||"-"],
      ["シリーズ", escapeHtml(c.series||"-")],
      ["文明", escapeHtml(c.civilizations.join("/")||"-")],
      ["種類", escapeHtml(c.card_type||"-")],
      ["コスト/パワー", `${c.cost??"-"} / ${c.power??"-"}`],
      ["レアリティ", escapeHtml(c.rarity||"-")],
      ["種族", escapeHtml(c.races.join("、")||"-")],
      ["イラスト", escapeHtml(c.illustrators.join("、")||"-")],
    ];
    let html = renderCardSection(c.image_url, c.card_name, c.ability_text, frontRows);
    html += `<div style="width:100%;">${tags}</div>`;

    if(c.has_back_side){
      const backRows = [
        ["文明", escapeHtml(c.back_civilization||"-")],
        ["種類", escapeHtml(c.back_card_type||"-")],
        ["コスト/パワー", `${c.back_cost??"-"} / ${c.back_power??"-"}`],
        ["種族", escapeHtml((c.back_race||"").split("/").join("、")||"-")],
      ];
      html += `
        <div class="card-divider">
          <div class="card-divider-label">裏面（サイキック・リンク等で複数枚が同じ裏面を共有することがあります）</div>
          ${renderCardSection(c.back_image_url, c.back_card_name, c.back_ability_text, backRows)}
        </div>
      `;
    }

    document.getElementById("modalBody").innerHTML = html;
    document.getElementById("modalOverlay").classList.add("open");
  }
  function closeModal(){ document.getElementById("modalOverlay").classList.remove("open"); }

  boot();
})();
</script>
